name: iOS CI

on:
  push:
    branches: [ ios ]
  pull_request:
    branches: [ ios ]

jobs:
  build:
    name: Build and Test
    runs-on: macos-14
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
    
    - name: Show Xcode version
      run: xcodebuild -version
    
    - name: Show Swift version
      run: swift --version
    
    - name: Build Simulator
      run: |
        xcodebuild build \
          -project CompositionHelper.xcodeproj \
          -scheme CompositionHelper \
          -sdk iphonesimulator \
          -destination "generic/platform=iOS Simulator" \
          CODE_SIGNING_ALLOWED=NO \
          COMPILER_INDEX_STORE_ENABLE=NO
    
    - name: Validate Info.plist
      run: |
        plutil -lint Info.plist
    
    - name: Create Archive (Test)
      run: |
        echo "Archive creation test"
        echo "This would create a .xcarchive in a real project"
    
    - name: Upload Build Artifacts
      if: success()
      uses: actions/upload-artifact@v6
      with:
        name: build-artifacts
        path: |
          Sources/
          Info.plist
        retention-days: 30

  lint:
    name: Code Linting
    runs-on: macos-14
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
    
    - name: Install SwiftLint
      run: brew install swiftlint
    
    - name: Run SwiftLint
      run: |
        swiftlint lint --reporter github-actions-logging
      continue-on-error: true

  validate:
    name: Validate Project Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Check for TODO/FIXME comments
        run: |
          grep -r "TODO\|FIXME" Sources/ || echo "No TODO/FIXME comments found"

      - name: Check file sizes
        run: |
          echo "File sizes:"
          find Sources -name "*.swift" -exec ls -lh {} \; | awk '{print $9, $5}'
