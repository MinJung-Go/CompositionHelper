name: iOS CI

on:
  push:
    branches: [ ios ]
  pull_request:
    branches: [ ios ]

jobs:
  build:
    name: Build and Test
    runs-on: macos-14
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
    
    - name: Show Xcode version
      run: xcodebuild -version
    
    - name: Show Swift version
      run: swift --version
    
    - name: Build Simulator
      run: |
        xcodebuild build \
          -project CompositionHelper.xcodeproj \
          -scheme CompositionHelper \
          -sdk iphonesimulator \
          -derivedDataPath "$RUNNER_TEMP/ios-review-build" \
          -destination "generic/platform=iOS Simulator" \
          CODE_SIGNING_ALLOWED=NO \
          COMPILER_INDEX_STORE_ENABLE=NO
    
    - name: Capture editor layouts
      run: |
        set -euo pipefail
        DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=[d for group in json.load(sys.stdin)["devices"].values() for d in group if "iPhone SE" in d["name"]]; print(devices[0]["udid"])')
        xcrun simctl boot "$DEVICE_ID"
        xcrun simctl bootstatus "$DEVICE_ID" -b
        xcrun simctl status_bar "$DEVICE_ID" override --time '9:41' --batteryState charged --batteryLevel 100
        xcrun simctl install "$DEVICE_ID" "$RUNNER_TEMP/ios-review-build/Build/Products/Debug-iphonesimulator/CompositionHelper.app"
        mkdir -p "$RUNNER_TEMP/editor-review"
        xcrun simctl launch "$DEVICE_ID" com.example.CompositionHelper --review-color
        sleep 15
        xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/editor-review/editor-small.png"
        xcrun simctl terminate "$DEVICE_ID" com.example.CompositionHelper
        xcrun simctl launch "$DEVICE_ID" com.example.CompositionHelper --review-color --review-empty
        sleep 3
        xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/editor-review/editor-empty.png"
        xcrun simctl terminate "$DEVICE_ID" com.example.CompositionHelper
        xcrun simctl ui "$DEVICE_ID" content_size accessibility-extra-extra-extra-large
        xcrun simctl launch "$DEVICE_ID" com.example.CompositionHelper --review-color
        sleep 15
        xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/editor-review/editor-large-type.png"

    - name: Upload editor screenshots
      uses: actions/upload-artifact@v6
      with:
        name: editor-review
        path: ${{ runner.temp }}/editor-review

    - name: Validate Info.plist
      run: |
        plutil -lint Info.plist
    
    - name: Color pipeline regression tests
      run: tools/test-color-core.sh

    - name: Upload Build Artifacts
      if: success()
      uses: actions/upload-artifact@v6
      with:
        name: build-artifacts
        path: |
          Sources/
          Info.plist
        retention-days: 30

  lint:
    name: Code Linting
    runs-on: macos-14
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
    
    - name: Install SwiftLint
      run: brew install swiftlint
    
    - name: Run SwiftLint
      run: |
        swiftlint lint --reporter github-actions-logging
      continue-on-error: true

  validate:
    name: Validate Project Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Check for TODO/FIXME comments
        run: |
          grep -r "TODO\|FIXME" Sources/ || echo "No TODO/FIXME comments found"

      - name: Check file sizes
        run: |
          echo "File sizes:"
          find Sources -name "*.swift" -exec ls -lh {} \; | awk '{print $9, $5}'
